name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        ruby: ['2.6', '3.1', '3.4']
        include:
          - os: macos-15
            ruby: '3.4'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Run tests
        run: |
          gem install minitest -v 5.22.3 --no-document
          if [ "$RUNNER_OS" = macOS ]; then
            ruby -Ilib -rtensorruby -e 'abort "Accelerate unavailable" unless TensorRuby::Backend::Accelerate.available?'
          fi
          ruby -Ilib test/tensorruby_test.rb
      - name: Verify released package layout
        run: |
          gem build tensorruby.gemspec --output tensorruby.gem
          package_dir="$(mktemp -d)"
          gem install --local tensorruby.gem --install-dir "$package_dir/gems" --no-document
          cd "$package_dir"
          export GEM_HOME="$package_dir/gems" GEM_PATH="$package_dir/gems"
          "$GEM_HOME/bin/tensorruby" --version
          "$GEM_HOME/bin/tensorruby" run xor
